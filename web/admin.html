<!doctype html><html lang="en-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALUSORA | Staff</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin.css"><script src="/admin.js?v=cf-20261103-1" defer></script></head>
<body><header class="site-header"><div class="shell nav-bar"><a class="brand" href="/"><span class="brand-mark">✿</span><span class="brand-type">ALUSORA <small>FLOWERS</small></span></a><nav><a href="/">← Return to storefront</a></nav></div></header>
<main class="shell staff-shell"><p class="eyebrow mini">STAFF ONLY</p><h1>Flower shop <em>dashboard.</em></h1><p class="form-help">Data is stored securely in Cloudflare D1. Keep your staff token confidential.</p>
<div class="staff-card staff-signin"><label>Staff access token <input type="password" id="admin-token" autocomplete="off" placeholder="Your private admin token"/></label><div class="staff-actions"><button id="staff-login" class="btn btn-dark">Load dashboard</button><button id="staff-logout" class="btn">Sign out</button></div><p class="form-feedback" role="status" id="admin-message"></p></div>
<section id="staff-data" hidden><div class="staff-stats" id="stats"></div>
<div class="staff-grid"><section class="staff-card"><h2>Recent event requests</h2><div id="quote-list"></div></section><section class="staff-card"><h2>Picked by You requests</h2><div id="custom-list"></div></section></div>
<div class="staff-grid"><section class="staff-card"><h2>Recent orders</h2><div id="order-list"></div></section><section class="staff-card"><h2>Inventory</h2><div id="stock-list"></div><form id="stock-form"><h3>Adjust stock</h3><label>SKU <select name="sku" id="stock-sku" required></select></label><label>Change in quantity <input name="delta" type="number" required min="-10000" max="10000" step="1" placeholder="e.g. +10 or -2"></label><label>Reason <input name="reason" required minlength="3" maxlength="120" placeholder="Delivery / damaged / correction"></label><button class="btn btn-dark" type="submit">Update stock</button></form></section></div>
</section></main></body></html>
